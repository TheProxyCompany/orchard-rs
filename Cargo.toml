[package]
name = "orchard-rs"
version = "2026.6.2"
edition = "2021"
description = "Rust client for Orchard - high-performance LLM inference on Apple Silicon"
license = "Apache-2.0"
repository = "https://github.com/TheProxyCompany/orchard-rs"
keywords = ["llm", "inference", "apple-silicon", "nng", "ipc"]
categories = ["api-bindings", "asynchronous"]

[lib]
name = "orchard"
crate-type = ["lib"]

[dependencies]
# NNG for IPC communication with PIE
nng = "1.0"
# Named only so src/ipc/client.rs can refuse to compile against an nng-sys
# without the listener fix (see [patch.crates-io] below). Same version and
# features as nng asks for, so the C library is built exactly as before.
nng-sys = { version = "1.4.0-rc.0", default-features = false }

# Async runtime
tokio = { version = "1", features = ["sync", "rt", "macros", "process", "fs", "io-util", "time"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"

# HTTP client for binary fetching
reqwest = { version = "0.12", features = ["stream", "json"] }

# Cryptography for SHA256 verification
sha2 = "0.10"

# Archive extraction
flate2 = "1"
tar = "0.4"

# HuggingFace Hub integration
hf-hub = { version = "0.5", features = ["tokio"] }

# Templating engine (Jinja2-compatible)
minijinja = { version = "2", features = ["json", "preserve_order"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }

# File locking for cross-process coordination
fs4 = "0.9"

# Base64 decoding for multimodal content
base64 = "0.22"

# Regex for placeholder parsing
regex = "1"

# Utilities
thiserror = "2"
dirs = "5"
tracing = "0.1.44"
futures = "0.3"
async-trait = "0.1"
rand = "0.8"
hex = "0.4"

# Unix system calls (Unix only)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
ctor = "0.2"

[build-dependencies]
serde_json = "1"

# nng-sys 1.4.0-rc.0 bundles nng C 1.4.0, which carries upstream bug #1523: a
# use-after-free race between sub0_recv_cb and sub0_ctx_cancel on SUB sockets
# with short receive timeouts — our 10ms recv loop rolls it ~100x/second and
# segfaulted Proxy.app after ~25h (nni_list_remove, NULL deref). The vendored
# copy backports upstream e623deda (nni_aio_completions), and the ipc part of
# upstream 9248ed74 (#1518): a peer that connects to a listening socket and is
# gone before the handshake made the listener stop accepting for good, so later
# pipes connected and their messages vanished. Our response endpoint listens.
#
# A [patch] only applies at the root of the workspace being built, so every
# workspace that consumes orchard-rs must repeat this one at its own root, and
# move it together with orchard-rs; src/ipc/client.rs refuses to compile
# otherwise.
[patch.crates-io]
nng-sys = { path = "vendor/nng-sys" }
