name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Buckshot preloads the full text/vision/media matrix concurrently. The
    # 192 GB runner exhausted Metal memory; use the existing 512 GB runner.
    runs-on: [self-hosted, terminal-1]
    timeout-minutes: 30
    env:
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          submodules: true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Run unit tests
        run: cargo test --release --lib --test gpu_lease

      - name: Checkout PIE and its private dependencies
        uses: actions/checkout@v6
        with:
          repository: TheProxyCompany/proxy-inference-engine
          token: ${{ secrets.GH_PAT }}
          path: .ci/proxy-inference-engine
          submodules: recursive

      - name: Build PIE
        working-directory: .ci/proxy-inference-engine
        run: ./scripts/build.sh -t Release

      - name: Run full Orchard RS suite
        run: |
          RUST_BACKTRACE=1 PIE_LOCAL_BUILD="$PWD/.ci/proxy-inference-engine/release" cargo test --release --test buckshot -- --nocapture
