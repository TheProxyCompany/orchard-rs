name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Buckshot preloads the full text/vision/media matrix concurrently. The
    # 192 GB runner exhausted Metal memory; use the existing 512 GB runner.
    runs-on: [self-hosted, terminal-1]
    timeout-minutes: 30
    env:
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          submodules: true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install pinned Rust tools
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          if ! command -v rustup >/dev/null; then
            export PATH="$(brew --prefix rustup)/bin:$PATH"
            echo "$(brew --prefix rustup)/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          echo "RUSTUP_TOOLCHAIN=1.97.1" >> "$GITHUB_ENV"
          rustup run 1.97.1 cargo fmt --version
          rustup run 1.97.1 cargo clippy --version

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Run unit tests
        run: cargo test --release --lib

      - name: Checkout PIE and its private dependencies
        uses: actions/checkout@v6
        with:
          repository: TheProxyCompany/proxy-inference-engine
          # Root #38's reviewed engine; testing main would certify another package.
          ref: 6177aface6aa71b37853233ba343142b585df8e1
          token: ${{ secrets.GH_PAT }}
          path: .ci/proxy-inference-engine
          submodules: recursive

      - name: Verify reviewed PIE revision
        working-directory: .ci/proxy-inference-engine
        run: |
          pie_expected=6177aface6aa71b37853233ba343142b585df8e1
          pie_actual="$(git rev-parse HEAD)"
          echo "PIE revision: $pie_actual"
          test "$pie_actual" = "$pie_expected"
          git submodule update --init --recursive
          git submodule status --recursive

      - name: Build PIE
        working-directory: .ci/proxy-inference-engine
        run: ./scripts/build.sh -t Release

      - name: Run full Orchard RS suite
        env:
          ORCHARD_GOLDEN_DIFF_DIR: ${{ runner.temp }}/orchard-rs-golden-diffs-${{ github.run_id }}-${{ github.run_attempt }}
          ORCHARD_REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, platform, subprocess
          def git(path, *args):
              return subprocess.check_output(["git", "-C", path, *args], text=True).strip()
          output = pathlib.Path(os.environ["ORCHARD_GOLDEN_DIFF_DIR"])
          output.mkdir(parents=True, exist_ok=True)
          metadata = {
              "requested_client_revision": os.environ["ORCHARD_REQUESTED_HEAD"],
              "tested_client_revision": git(".", "rev-parse", "HEAD"),
              "engine_revision": git(".ci/proxy-inference-engine", "rev-parse", "HEAD"),
              "profile_revision": git("profiles", "rev-parse", "HEAD"),
              "engine_submodules": git(".ci/proxy-inference-engine", "submodule", "status", "--recursive").splitlines(),
              "platform": platform.platform(),
              "machine": platform.machine(),
              "rustc": subprocess.check_output(["rustc", "--version"], text=True).strip(),
          }
          if platform.system() == "Darwin":
              metadata["cpu"] = subprocess.check_output(["sysctl", "-n", "machdep.cpu.brand_string"], text=True).strip()
          (output / "revisions.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
          export RUST_BACKTRACE=1 PIE_LOCAL_BUILD="$PWD/.ci/proxy-inference-engine/release"
          python3 - <<'PYTEST'
          import fcntl, subprocess
          # Share the same lease as orchard-py and explicit local acceptance runs.
          with open("/tmp/proxy-gpu.lease", "a") as lease:
              print("Waiting for the runner GPU lease", flush=True)
              fcntl.flock(lease, fcntl.LOCK_EX)
              print("Runner GPU lease acquired", flush=True)
              subprocess.run([
                  "cargo", "test", "--release", "--test", "buckshot", "--", "--nocapture",
              ], check=True)
          PYTEST

      - name: Upload golden-drift evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: orchard-rs-golden-drift-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orchard-rs-golden-diffs-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
