name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Buckshot preloads the full text/vision/media matrix concurrently. The
    runs-on: [self-hosted, ci-cd]
    timeout-minutes: 60
    env:
      PATH: /opt/homebrew/opt/rustup/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
      PIE_REVISION: 73a4e3f41bdceec4c962d06b6478ebfbeaa2a0e4

    steps:
      - name: Get the App's token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
          submodules: true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Ensure Rust toolchain is on PATH
        run: |
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          printf "%s\n" "$HOME/.cargo/bin" /opt/homebrew/bin >> "$GITHUB_PATH"
          if ! command -v cargo >/dev/null 2>&1; then
            if [ -x "/opt/homebrew/opt/rustup/bin/rustup" ]; then
              export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
              echo "/opt/homebrew/opt/rustup/bin" >> "$GITHUB_PATH"
            else
              brew list rust >/dev/null 2>&1 && brew link --overwrite rust || brew install rust
            fi
          fi
          cargo --version

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Run unit tests
        run: cargo test --release --lib

      - name: Checkout PIE and its private dependencies
        uses: actions/checkout@v6
        with:
          repository: TheProxyCompany/proxy-inference-engine
          ref: ${{ env.PIE_REVISION }}
          token: ${{ steps.app.outputs.token }}
          path: .ci/proxy-inference-engine
          submodules: recursive
          persist-credentials: false

      - name: Build PIE
        working-directory: .ci/proxy-inference-engine
        run: ./scripts/build.sh -t Release

      - name: Run full Orchard RS suite
        run: |
          set -euo pipefail
          # The test fixture shuts down only this fresh namespace's engine.
          orchard_test_root="$(mktemp -d "$RUNNER_TEMP/orchard-rs.XXXXXX")"
          echo "ORCHARD_TEST_ROOT=$orchard_test_root" >> "$GITHUB_ENV"
          env -u ORCHARD_IPC_ROOT -u PROXY_GPU_LEASE -u PROXY_GPU_LEASE_HELD \
            ORCHARD_CACHE_ROOT="$orchard_test_root" RUST_BACKTRACE=1 \
            PIE_LOCAL_BUILD="$PWD/.ci/proxy-inference-engine/release" \
            cargo test --release --test buckshot -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/orchard-rs-buckshot.log"

      - name: Upload Orchard failure logs
        if: failure() && env.ORCHARD_TEST_ROOT != ''
        uses: actions/upload-artifact@v4
        with:
          name: orchard-rs-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ORCHARD_TEST_ROOT }}/*.log
            ${{ runner.temp }}/orchard-rs-buckshot.log
          retention-days: 7