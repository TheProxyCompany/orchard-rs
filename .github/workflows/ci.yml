name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Buckshot preloads the full text/vision/media matrix concurrently. The
    # 192 GB runner exhausted Metal memory; use the existing 512 GB runner.
    runs-on: [self-hosted, terminal-1]
    timeout-minutes: 30
    env:
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
      PIE_REVISION: 59fd4a6447bc3d7741aecb40f1d2934b78dd2391

    steps:
      - name: Get the App's token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Require 512 GiB for the full matrix
        run: |
          set -euo pipefail
          memory_bytes="$(sysctl -n hw.memsize)"
          if [[ ! "$memory_bytes" =~ ^[0-9]+$ ]] || (( memory_bytes < 512 * 1024 * 1024 * 1024 )); then
            echo "::error::Full Orchard matrix requires at least 512 GiB RAM; found $memory_bytes bytes"
            exit 1
          fi
          echo "Physical RAM: $memory_bytes bytes"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
          submodules: true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Run unit tests
        run: cargo test --release --lib

      - name: Checkout PIE and its private dependencies
        uses: actions/checkout@v6
        with:
          repository: TheProxyCompany/proxy-inference-engine
          ref: ${{ env.PIE_REVISION }}
          token: ${{ steps.app.outputs.token }}
          path: .ci/proxy-inference-engine
          submodules: recursive
          persist-credentials: false

      - name: Build PIE
        working-directory: .ci/proxy-inference-engine
        run: ./scripts/build.sh -t Release

      - name: Run full Orchard RS suite
        run: |
          set -euo pipefail
          # The test fixture shuts down only this fresh namespace's engine.
          orchard_test_root="$(mktemp -d "$RUNNER_TEMP/orchard-rs.XXXXXX")"
          echo "ORCHARD_TEST_ROOT=$orchard_test_root" >> "$GITHUB_ENV"
          env -u ORCHARD_IPC_ROOT -u PROXY_GPU_LEASE -u PROXY_GPU_LEASE_HELD \
            ORCHARD_CACHE_ROOT="$orchard_test_root" RUST_BACKTRACE=1 \
            PIE_LOCAL_BUILD="$PWD/.ci/proxy-inference-engine/release" \
            bash scripts/gpu_lease.sh cargo test --release --test buckshot -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/orchard-rs-buckshot.log"

      - name: Upload Orchard failure logs
        if: failure() && env.ORCHARD_TEST_ROOT != ''
        uses: actions/upload-artifact@v4
        with:
          name: orchard-rs-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ORCHARD_TEST_ROOT }}/*.log
            ${{ runner.temp }}/orchard-rs-buckshot.log
          retention-days: 7
