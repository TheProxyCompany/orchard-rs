name: Publish to crates.io

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: [self-hosted, ci-cd]
    timeout-minutes: 30
    env:
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    permissions:
      contents: write

    steps:
      - name: Get the App's token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      - name: Bump version
        id: version
        run: |
          # Read current version from Cargo.toml
          CURRENT=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')

          # Parse calver: YYYY.MM.PATCH
          YEAR=$(echo $CURRENT | cut -d. -f1)
          MONTH=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)

          # Get current date
          NOW_YEAR=$(date +%Y)
          NOW_MONTH=$(date +%-m)

          # Bump version
          if [ "$YEAR" != "$NOW_YEAR" ] || [ "$MONTH" != "$NOW_MONTH" ]; then
            NEW_VERSION="${NOW_YEAR}.${NOW_MONTH}.1"
          else
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${YEAR}.${MONTH}.${NEW_PATCH}"
          fi

          # Update Cargo.toml
          sed -i '' "s/^version = \".*\"/version = \"${NEW_VERSION}\"/" Cargo.toml

          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "previous=${CURRENT}" >> $GITHUB_OUTPUT
          echo "Bumped version: ${CURRENT} → ${NEW_VERSION}"

      - name: Build
        run: cargo build --release

      - name: Run unit tests
        run: cargo test --release --lib

      - name: Clone and build PIE
        run: |
          rm -rf ../proxy-inference-engine
          git clone --depth 1 --recurse-submodules "https://x-access-token:${{ steps.app.outputs.token }}@github.com/TheProxyCompany/proxy-inference-engine.git" ../proxy-inference-engine
          cd ../proxy-inference-engine
          ./scripts/build.sh -t Release

      - name: Run full Orchard RS suite
        run: |
          PIE_LOCAL_BUILD="$PWD/../proxy-inference-engine/release" cargo test --test functional
          PIE_LOCAL_BUILD="$PWD/../proxy-inference-engine/release" cargo test --test golden

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --allow-dirty

      - name: Commit version bump
        run: |
          git config user.name "the-proxy-company[bot]"
          git config user.email "332167312+the-proxy-company[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "v${{ steps.version.outputs.version }}"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
