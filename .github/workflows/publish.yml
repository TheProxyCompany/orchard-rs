name: Publish to crates.io

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: [self-hosted, terminal-0]
    timeout-minutes: 180
    env:
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Bump version
        id: version
        run: |
          # Read current version from Cargo.toml
          CURRENT=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')

          # Parse calver: YYYY.MM.PATCH
          YEAR=$(echo $CURRENT | cut -d. -f1)
          MONTH=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)

          # Get current date
          NOW_YEAR=$(date +%Y)
          NOW_MONTH=$(date +%-m)

          # Bump version
          if [ "$YEAR" != "$NOW_YEAR" ] || [ "$MONTH" != "$NOW_MONTH" ]; then
            NEW_VERSION="${NOW_YEAR}.${NOW_MONTH}.1"
          else
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${YEAR}.${MONTH}.${NEW_PATCH}"
          fi

          # Update Cargo.toml
          sed -i '' "s/^version = \".*\"/version = \"${NEW_VERSION}\"/" Cargo.toml

          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "previous=${CURRENT}" >> $GITHUB_OUTPUT
          echo "Bumped version: ${CURRENT} → ${NEW_VERSION}"

      - name: Build
        run: cargo build --release

      - name: Run unit tests
        run: cargo test --release --lib

      - name: Clone and build PIE
        run: |
          rm -rf ../proxy-inference-engine
          git clone --depth 1 --recurse-submodules "https://${{ secrets.GH_PAT }}@github.com/TheProxyCompany/proxy-inference-engine.git" ../proxy-inference-engine
          cd ../proxy-inference-engine
          ./scripts/build.sh -t Release

      - name: Run combined Orchard PY and RS Buckshot release proof
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/company-buckshot"
          rm -rf "$ROOT"
          git clone --depth 1 "https://${{ secrets.GH_PAT }}@github.com/TheProxyCompany/The-Proxy-Company.git" "$ROOT"
          git -C "$ROOT" submodule update --init orchard-py Pane Trellis grand-central
          rm -rf "$ROOT/orchard-rs" "$ROOT/proxy-inference-engine"
          ln -s "$GITHUB_WORKSPACE" "$ROOT/orchard-rs"
          ln -s "$(cd ../proxy-inference-engine && pwd)" "$ROOT/proxy-inference-engine"
          cd "$ROOT/orchard-py"
          if command -v uv >/dev/null 2>&1; then
            uv --no-config venv .venv
            source .venv/bin/activate
            uv --no-config pip install -e ".[dev]"
          else
            python3 -m venv .venv
            source .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e ".[dev]"
          fi
          cd "$ROOT"
          orchard-py/.venv/bin/python scripts/buckshot_all_clients.py

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --allow-dirty

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "v${{ steps.version.outputs.version }}"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
